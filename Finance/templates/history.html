{% extends "layout.html"%}

{% block title %}
    History
{% endblock %}

{% block main %}
    <div class="section">
        <h2>Stocks</h2>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Type</th>
                    <th>Shares</th>
                    <th>Price</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>{{ item.symbol }}</td>
                    <td>{{ item.type }}</td>
                    <td>{{ item.shares }}</td>
                    <td>{{ item.price }}</td>
                    <td>{{ item.time }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
