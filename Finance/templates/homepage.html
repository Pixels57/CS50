{% extends "layout.html"%}

{% block title %}
    Homepage
{% endblock %}

{% block main %}
    <div class="section">
        <h2>Cash</h2>
        <p>{{ money }}</p>
    </div>
    <div class="section">
        <h2>Stocks</h2>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Shares</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>{{ item.symbol }}</td>
                    <td>{{ item.shares }}</td>
                    <td>{{ livevalue[loop.index0] }}</td>
                    <td>{{ livetotal[loop.index0] }}</td>
                    <td>
                        <form action="/trade" method="post" style="display: inline;">
                            <input type="hidden" name="symbol" value="{{ item.symbol }}">
                            <input type="number" name="shares" min="1" required>
                            <button type="submit" name="action" value="buy">Buy</button>
                            <button type="submit" name="action" value="sell">Sell</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
