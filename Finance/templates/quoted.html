{% extends "layout.html"%}

{% block title %}
    Quoted
{% endblock %}

{% block main %}
    <div class="section">
        <h2>Stock</h2>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{ data["symbol"] }}</td>
                    <td>{{ data["price"] }}</td>
                </tr>
            </tbody>
        </table>
    </div>
{% endblock %}
